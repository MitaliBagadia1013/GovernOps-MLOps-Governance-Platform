apiVersion: machinelearning.seldon.io/v1
kind: SeldonDeployment
metadata:
  name: credit-risk-canary
  namespace: mlops-models
  labels:
    app: credit-risk
    version: canary
spec:
  name: credit-risk
  protocol: tensorflow
  transport: rest
  
  predictors:
  
  - name: baseline
    replicas: 2
    traffic: 95
    
    componentSpecs:
    - spec:
        containers:
        - name: classifier
          image: credit-risk-model:v2.0.0
          imagePullPolicy: IfNotPresent
          
          env:
          - name: MODEL_NAME
            value: "credit_risk"
          - name: MODEL_VERSION
            value: "2.0.0"
          - name: ENVIRONMENT
            value: "production"
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /health/ping
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 5
    
    graph:
      name: classifier
      type: MODEL
      endpoint:
        type: REST
      
      parameters:
      - name: model_name
        type: STRING
        value: credit_risk
      - name: model_version
        type: STRING
        value: "2.0.0"
    
    labels:
      version: v2.0.0
      deployment_type: baseline
      model: credit_risk
  
  - name: canary
    replicas: 1
    traffic: 5
    
    componentSpecs:
    - spec:
        containers:
        - name: classifier
          image: credit-risk-model:v2.0.0-canary
          imagePullPolicy: IfNotPresent
          
          env:
          - name: MODEL_NAME
            value: "credit_risk"
          - name: MODEL_VERSION
            value: "2.0.0-canary"
          - name: ENVIRONMENT
            value: "canary"
          - name: ENABLE_METRICS
            value: "true"
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /health/ping
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 5
    
    graph:
      name: classifier
      type: MODEL
      endpoint:
        type: REST
      
      parameters:
      - name: model_name
        type: STRING
        value: credit_risk
      - name: model_version
        type: STRING
        value: "2.0.0-canary"
    
    labels:
      version: v2.0.0-canary
      deployment_type: canary
      model: credit_risk
      experiment: canary_validation

---
apiVersion: v1
kind: Service
metadata:
  name: credit-risk-lb
  namespace: mlops-models
spec:
  type: NodePort
  selector:
    seldon-deployment-id: credit-risk-canary
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 9000
    nodePort: 30080

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary-thresholds
  namespace: mlops-models
data:
  max_latency_ms: "200"
  min_success_rate: "0.95"
  max_error_rate: "0.05"
  evaluation_period_seconds: "300"
  
  baseline_traffic: "95"
  canary_traffic: "5"
  
  auto_rollback_enabled: "true"
  rollback_on_error_threshold: "true"
  rollback_on_latency_threshold: "true"
