version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mlops-postgres
    environment:
      POSTGRES_DB: mlops_registry
      POSTGRES_USER: mlops_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mlops_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops_user -d mlops_registry"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mlops-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mlops.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - mlops-network
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlops-mlflow
    command: >
      mlflow server
      --backend-store-uri postgresql://mlops_user:${DB_PASSWORD:-mlops_password}@postgres:5432/mlflow
      --default-artifact-root s3://mlops-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops-network
    restart: unless-stopped

  model-registry-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mlops_registry
      DB_USER: mlops_user
      DB_PASSWORD: ${DB_PASSWORD:-mlops_password}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mlops-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
